# Monorepo release pipeline for test-collector-swift, uploaded by the
# release dispatcher (.buildkite/pipeline.release.yml) running on the
# separate bktest-release Buildkite pipeline. Rehearsals extract the Swift
# history and verify its relationship to the standalone release mirror;
# release builds push a plain semantic-version tag for SwiftPM consumers.
#
# Safety model:
#   - The rehearsal step is read-only: it never sees RELEASE_PUBLISH (set
#     only on the publish step below) or the push credential, so it stops
#     before pushing even on tag builds.
#   - The push credential is a repository-specific SSH deploy key stored as
#     a Buildkite secret whose access policy is pinned to bktest-release.
#   - The publish step exists only on an exact stable or prerelease semantic
#     version tag, behind a block step; it sets RELEASE_PUBLISH=true in its
#     own environment, and the release script independently re-checks the
#     tag and RELEASE_PUBLISH before pushing.

agents:
  queue: hosted

steps:
  - label: ":swift: test-collector-swift: extract + rehearse release mirror"
    key: swift-build
    command: test-collector-swift/.buildkite/steps/release
    plugins:
      - docker#v5.12.0:
          image: "python:3.13"
          environment:
            - BUILDKITE_TAG

  - label: ":github: test-collector-swift: verify release mirror credential"
    key: swift-credentials
    command: |
      if buildkite-agent secret get TEST_COLLECTOR_SWIFT_DEPLOY_KEY > /dev/null 2>&1; then
        echo "ok: release mirror deploy key is readable"
      else
        echo "TEST_COLLECTOR_SWIFT_DEPLOY_KEY is not available to bktest-release yet"
        exit 1
      fi
    soft_fail: true

  - block: ":rocket: Mirror test-collector-swift release tag?"
    key: swift-confirm
    if: build.tag =~ /^test-collector-swift\/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$/

  - label: ":github: test-collector-swift: push release mirror tag"
    if: build.tag =~ /^test-collector-swift\/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?$/
    depends_on:
      - swift-build
      - swift-confirm
    env:
      # Step-local publish signal: distinguishes this credentialed step from
      # the rehearsal build step, which runs the same script.
      RELEASE_PUBLISH: "true"
    command: test-collector-swift/.buildkite/steps/release
    plugins:
      - docker#v5.12.0:
          image: "python:3.13"
          mount-buildkite-agent: true
          environment:
            - BUILDKITE_TAG
            - RELEASE_PUBLISH
